spring:
  application:
    name: shop
  datasource:
    url: jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        generate_statistics: true
  h2:
    console:
      enabled: true

logging:
  level:
    # SQL sent to the database. Parameter values: org.hibernate.orm.jdbc.bind: trace
    org.hibernate.SQL: debug
    # Hibernate statistics after every session: how many JDBC queries and how long it took. Turn off: info
    org.hibernate.session.metrics: debug
